# Fluent Bit Service Configuration
[SERVICE]
    Flush         1
    Daemon        Off
    Log_Level     info
    storage.path  /fluent-bit/state
    Parsers_File  /fluent-bit/etc/parsers.conf

# Proxy Access Logs
[INPUT]
    Name              tail
    Path              /logs/proxy/access.json
    Parser            json
    Tag               zta.proxy
    DB                /fluent-bit/state/proxy.db
    Read_from_Head    true

# Web Access Logs
[INPUT]
    Name              tail
    Path              /logs/web/access.json
    Parser            json
    Tag               zta.web
    DB                /fluent-bit/state/web.db
    Read_from_Head    true

# Hping Logs
[INPUT]
    Name              tail
    Path              /logs/hping/hping.jsonl
    Parser            json
    Tag               zta.hping
    DB                /fluent-bit/state/hping.db
    Read_from_Head    true

# ZAP HTTP Report
[INPUT]
    Name              tail
    Path              /logs/zap-reports/zap-http-report.json
    Parser            json
    Tag               zta.zap.http
    DB                /fluent-bit/state/zap-http.db
    Read_from_Head    true

# ZAP HTTPS Report
[INPUT]
    Name              tail
    Path              /logs/zap-reports/zap-https-report.json
    Parser            json
    Tag               zta.zap.https
    DB                /fluent-bit/state/zap-https.db
    Read_from_Head    true

# WAF Audit Logs
[INPUT]
    Name              tail
    Path              /logs/waf/audit.log
    Tag               zta.waf.raw
    DB                /fluent-bit/state/waf.db
    Read_from_Head    true

# Output: Proxy Logs
[OUTPUT]
    Name               opensearch
    Match              zta.proxy
    Host               opensearch-node
    Port               9200
    Index              zta-proxy
    Generate_ID        On
    Suppress_Type_Name On

# Output: Web Logs
[OUTPUT]
    Name               opensearch
    Match              zta.web
    Host               opensearch-node
    Port               9200
    Index              zta-web
    Generate_ID        On
    Suppress_Type_Name On

# Output: Hping Logs
[OUTPUT]
    Name               opensearch
    Match              zta.hping
    Host               opensearch-node
    Port               9200
    Index              zta-hping
    Generate_ID        On
    Suppress_Type_Name On

# Output: ZAP HTTP Logs
[OUTPUT]
    Name               opensearch
    Match              zta.zap.http
    Host               opensearch-node
    Port               9200
    Index              zta-zap-http
    Generate_ID        On
    Suppress_Type_Name On

# Output: ZAP HTTPS Logs
[OUTPUT]
    Name               opensearch
    Match              zta.zap.https
    Host               opensearch-node
    Port               9200
    Index              zta-zap-https
    Generate_ID        On
    Suppress_Type_Name On

# Output: WAF Raw Logs
[OUTPUT]
    Name               opensearch
    Match              zta.waf.raw
    Host               opensearch-node
    Port               9200
    Index              zta-waf-raw
    Generate_ID        On
    Suppress_Type_Name On