# Event module configuration
events {}

# HTTP module configuration
http {
    # Include standard MIME types for content-type headers
    include /etc/nginx/mime.types;
    # Default MIME type for responses
    default_type application/octet-stream;

    # Custom JSON log format for structured logging
    # Includes timestamp, request details, response info, and upstream metrics
    # escape=json ensures proper JSON escaping of special characters
    log_format json_combined escape=json
      '{'
        '"ts":"$time_iso8601",'              # ISO 8601 timestamp
        '"host":"$host",'                    # Host header value
        '"server_name":"$server_name",'      # Server name
        '"remote_addr":"$remote_addr",'      # Client's IP address
        '"x_forwarded_for":"$http_x_forwarded_for",'  # Original client IP (if proxied)
        '"request":"$request",'              # Full request line
        '"method":"$request_method",'        # HTTP method (GET, POST, etc)
        '"uri":"$request_uri",'              # Request URI
        '"status":$status,'                  # HTTP response status code
        '"bytes_sent":$bytes_sent,'          # Bytes sent to client
        '"referer":"$http_referer",'         # Referer header
        '"user_agent":"$http_user_agent",'   # User-Agent header
        '"request_time":$request_time,'      # Total request processing time
        '"upstream_addr":"$upstream_addr",'  # Upstream server address
        '"upstream_status":"$upstream_status",'  # Upstream response status
        '"upstream_response_time":"$upstream_response_time",'  # Upstream response time
        '"scheme":"$scheme"'                 # Request scheme (http/https)
      '}';

    # Configure access and error logging
    access_log /var/log/nginx/access.json json_combined;  # Log all requests in JSON format
    error_log /var/log/nginx/error.log warn;  # Log warnings and errors

    server {
        listen 80;
        server_name localhost;

        # HTTP endpoint for proxying requests
        location /http/ {
            proxy_pass http://web:80/;  # Forward requests to upstream web service
            proxy_set_header Host $host;  # Preserve original Host header
            proxy_set_header X-Real-IP $remote_addr;  # Pass client's real IP
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;  # Add to forwarded chain
            proxy_set_header X-Forwarded-Proto http;  # Indicate original protocol
        }

        # Redirect root requests to HTTP location
        location / {
            return 301 /http/;  # Permanent redirect to HTTP endpoint
        }
    }

    server {
        listen 443 ssl;  # Listen on HTTPS port 443 with SSL
        server_name localhost;  # Server name for this virtual host

        # SSL certificate configuration
        ssl_certificate     /etc/nginx/certs/localhost.crt;      # SSL certificate file
        ssl_certificate_key /etc/nginx/certs/localhost.key;      # Private key file

        # HTTPS endpoint for proxying secure requests
        location /https/ {
            proxy_pass https://web:443/;  # Forward requests to upstream secure web service
            proxy_set_header Host $host;  # Preserve original Host header
            proxy_set_header X-Real-IP $remote_addr;  # Pass client's real IP
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;  # Add to forwarded chain
            proxy_set_header X-Forwarded-Proto https;  # Indicate original protocol (HTTPS)
            proxy_ssl_server_name on;  # Enable SNI (Server Name Indication)
            proxy_ssl_name localhost;  # Upstream server name for SSL verification
            proxy_ssl_trusted_certificate /etc/nginx/certs/localCA.crt;  # Trusted CA certificate
            proxy_ssl_verify on;  # Enable SSL certificate verification
            proxy_ssl_verify_depth 2;  # Verification depth for certificate chain
        }

        # Redirect root requests to HTTPS location
        location / {
            return 301 /https/;  # Permanent redirect to HTTPS endpoint
        }
    }
}
